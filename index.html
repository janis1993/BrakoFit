<!doctype html><html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b10"><link rel="manifest" href="manifest.json"><title>BrakoFit V5</title><style>
:root{--bg:#080b10;--panel:#111720;--panel2:#18212d;--line:#2a3545;--text:#f5f7f9;--muted:#98a4b3;--accent:#79e08f;--accent2:#183f29;--red:#ff7c86;--amber:#ffd166}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:10;background:#0a0f16ee;backdrop-filter:blur(12px);padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}header b{font-size:22px;color:var(--accent)}main{max-width:980px;margin:auto;padding:18px 14px 100px}.card{background:linear-gradient(150deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.hero{background:linear-gradient(135deg,#153a25,#111a22)}h1,h2,h3{margin:.2em 0 .6em}.muted,small{color:var(--muted)}.grid{display:grid;gap:12px}.two{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}button{border:0;border-radius:11px;padding:11px 13px;background:var(--accent);color:#07120b;font-weight:800;cursor:pointer}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.danger{background:#3f1c24;color:#ffadb4}.warn{background:#483b17;color:#ffe29a}.tag{display:inline-block;background:var(--accent2);color:#acf2b9;padding:4px 8px;border-radius:20px;font-size:12px;font-weight:750}.time{font-size:28px;font-weight:800;color:var(--accent)}input,select,textarea{width:100%;background:#0b1118;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}label{display:block;color:#d2d9e1;font-size:13px;font-weight:750;margin:9px 0 4px}.sets{display:grid;grid-template-columns:32px 1fr 1fr 38px;gap:7px;align-items:center;margin:7px 0}.prev{display:grid;grid-template-columns:32px 1fr 1fr;gap:6px;padding:5px 0;color:#c3ccd6}.exercise-row{display:grid;grid-template-columns:34px 1fr 42px 42px 42px;gap:6px;align-items:center;margin:7px 0}.daybox{border:1px solid var(--line);border-radius:15px;padding:12px;margin:10px 0;background:#0d131b}.appt{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center}.conflict{border-color:#765d20;background:#241f12}.folder{cursor:pointer}.empty{text-align:center;color:var(--muted);padding:28px}.ok{color:var(--accent)}nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#0c1118;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 2px env(safe-area-inset-bottom)}nav button{background:none;color:var(--muted);font-size:11px;padding:7px 1px}nav button.active{color:var(--accent)}dialog{width:min(560px,95%);max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);padding:18px}dialog::backdrop{background:#000c}@media(min-width:760px){nav{top:61px;bottom:0;right:auto;width:160px;display:flex;flex-direction:column;padding:16px 8px}nav button{font-size:14px;text-align:left;padding:12px}main{padding-left:180px}.sets{grid-template-columns:40px 1fr 1fr 42px}}</style></head><body><header><b>BrakoFit V5</b><small>Mobile</small></header><nav id="nav"></nav><main id="app"></main><dialog id="dlg"></dialog><script>
const seed={version:5,programs:[{id:'p1',name:'Linda PPL',days:[{name:'Push',ex:[{name:'Incline chest press',sets:4,reps:'12/12/10/10'},{name:'Bench chest press',sets:4,reps:'12/12/10/10'},{name:'Chest fly',sets:3,reps:'12/12/12'}]},{name:'Pull',ex:[{name:'Lat pulldown',sets:4,reps:'12/12/10/10'},{name:'Cable row',sets:4,reps:'12/12/10/10'}]},{name:'Legs',ex:[{name:'Squat',sets:4,reps:'12/12/10/10'},{name:'Leg extension',sets:3,reps:'12/12/12'}]}]}],clients:[{id:'linda',name:'Linda',programId:'p1',notes:''}],groups:[],events:[],sessions:[]};
function migrate(x){if(!x)return seed;x.version=5;x.groups=x.groups||[];x.events=x.events||[];x.sessions=x.sessions||[];x.programs=(x.programs||[]).map(p=>({...p,days:(p.days||[]).map(d=>({...d,ex:(d.ex||[]).map(e=>typeof e==='string'?{name:e,sets:4,reps:'12/12/10/10'}:{sets:4,reps:'12/12/10/10',...e})}))}));return x}let old=localStorage.getItem('brakofit-v5')||localStorage.getItem('brakofit-v3');let db=migrate(old?JSON.parse(old):null);const save=()=>localStorage.setItem('brakofit-v5',JSON.stringify(db));save();let page='home',current=null,selectedClient=null,selectedSession=null,editingProgram=null;const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const today=()=>new Date().toISOString().slice(0,10);const tabs=[['home','⌂ Sākums'],['clients','♙ Klienti'],['programs','▤ Programmas'],['groups','◎ Grupas'],['calendar','▣ Kalendārs'],['history','↻ Vēsture']];function go(p){page=p;render()}function render(){nav.innerHTML=tabs.map(t=>`<button class="${page===t[0]?'active':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');({home,clients,client,programs,programEditor,groups,calendar,history,clientHistory,sessionDetail,workout,groupWorkout}[page]||home)()}function prog(id){return db.programs.find(p=>p.id===id)}function clientName(id){return db.clients.find(c=>c.id===id)?.name||'Klients'}
function home(){let ev=db.events.filter(e=>e.date===today()).sort((a,b)=>a.time.localeCompare(b.time)),next=ev.find(e=>!e.done);app.innerHTML=`<div class="card hero"><small>${new Date().toLocaleDateString('lv-LV',{weekday:'long'}).toUpperCase()}</small><h1>${new Date().toLocaleDateString('lv-LV',{day:'2-digit',month:'2-digit',year:'numeric'})}</h1>${next?`<small>Nākamais treniņš</small><div class=time>${E(next.time)}</div><h2>${E(eventTitle(next))}</h2><span class=tag>${E(next.day)}</span><p><button onclick="startEvent('${next.id}')">Sākt treniņu</button></p>`:'<p class=muted>Šodien vairs nav ieplānotu treniņu.</p>'}</div><h2>Šodienas grafiks</h2>${ev.length?ev.map(e=>`<div class="card appt ${sameTimeCount(e)>1?'conflict':''}"><div class=time>${E(e.time)}</div><div><b>${E(eventTitle(e))}</b><div><span class=tag>${E(e.day)}</span> ${e.done?'<span class=ok>✓ Pabeigts</span>':''}</div></div><button class=secondary onclick="startEvent('${e.id}')">Sākt</button></div>`).join(''):'<div class=empty>Šodien nav pierakstu.</div>'}`}
function eventTitle(e){return e.groupId?(db.groups.find(g=>g.id===e.groupId)?.name||'Grupa'):clientName(e.clientId)}function sameTimeCount(e){return db.events.filter(x=>x.date===e.date&&x.time===e.time&&x.id!==e.id).length+1}function startEvent(id){let e=db.events.find(x=>x.id===id);if(e.groupId)startGroup(e.groupId,e.day);else start(e.clientId,e.day);e.done=true;save()}
function clients(){app.innerHTML=`<div class=row><h1>Klienti</h1><button onclick="clientForm()">+ Klients</button></div><input placeholder="Meklēt klientu" oninput="filterClients(this.value)"><div id=clientList>${clientCards(db.clients)}</div>`}function clientCards(a){return `<div class="grid two">${a.map(c=>`<div class=card><h3>${E(c.name)}</h3><p class=muted>${E(prog(c.programId)?.name||'Nav programmas')}</p><div class=row><button class=secondary onclick="openClient('${c.id}')">Atvērt</button><button class=secondary onclick="assignForm('${c.id}')">Piešķirt programmu</button></div></div>`).join('')}</div>`}function filterClients(q){clientList.innerHTML=clientCards(db.clients.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())))}function openClient(id){selectedClient=id;page='client';render()}function client(){let c=db.clients.find(x=>x.id===selectedClient),p=prog(c.programId);app.innerHTML=`<button class=secondary onclick="go('clients')">← Atpakaļ</button><div class=card><h1>${E(c.name)}</h1><p>${p?`<span class=tag>${E(p.name)}</span>`:'Nav programmas'}</p><p class=muted>${E(c.notes)}</p>${p?p.days.map(d=>`<button style="margin:3px" onclick="start('${c.id}','${E(d.name)}')">${E(d.name)}</button>`).join(''):''}<p><button class=secondary onclick="openHistory('${c.id}')">Treniņu vēsture</button></p></div>`}function clientForm(){dlgOpen(`<h2>Jauns klients</h2><label>Vārds</label><input id=cn><label>Piezīmes</label><textarea id=cnotes></textarea><label>Programma</label><select id=cp><option value="">Bez programmas</option>${db.programs.map(p=>`<option value="${p.id}">${E(p.name)}</option>`).join('')}</select><button onclick="addClient()">Saglabāt</button>`)}function addClient(){if(!cn.value.trim())return;db.clients.push({id:crypto.randomUUID(),name:cn.value.trim(),notes:cnotes.value,programId:cp.value});save();dlgClose();render()}function assignForm(id){dlgOpen(`<h2>Piešķirt programmu</h2><select id=ap><option value="">Bez programmas</option>${db.programs.map(p=>`<option value="${p.id}">${E(p.name)}</option>`).join('')}</select><button onclick="assign('${id}')">Saglabāt</button>`)}function assign(id){db.clients.find(c=>c.id===id).programId=ap.value;save();dlgClose();render()}
function programs(){app.innerHTML=`<div class=row><h1>Programmas</h1><button onclick="newProgram()">+ Programma</button></div>${db.programs.map(p=>`<div class=card><div class=row><div><h3>${E(p.name)}</h3><small>${p.days.length} treniņu dienas</small></div><button class=secondary onclick="editProgram('${p.id}')">Rediģēt</button><button class=secondary onclick="copyProgram('${p.id}')">Kopēt</button></div>${p.days.map(d=>`<div class=daybox><b>${E(d.name)}</b>${d.ex.map((e,i)=>`<div class=exercise-row><span>${i+1}.</span><span>${E(e.name)}<br><small>${e.sets} seti · ${E(e.reps)}</small></span></div>`).join('')}</div>`).join('')}</div>`).join('')}`}
function newProgram(){editingProgram={id:crypto.randomUUID(),name:'',days:[{name:'Push',ex:[]}]};page='programEditor';render()}function editProgram(id){editingProgram=JSON.parse(JSON.stringify(prog(id)));page='programEditor';render()}function programEditor(){app.innerHTML=`<button class=secondary onclick="go('programs')">← Atcelt</button><div class=card><h1>Programmas redaktors</h1><label>Programmas nosaukums</label><input id=pname value="${E(editingProgram.name)}" onchange="editingProgram.name=this.value"><div id=days>${editingProgram.days.map((d,di)=>dayEditor(d,di)).join('')}</div><button class=secondary onclick="addDay()">+ Treniņu diena</button><button style="width:100%;margin-top:12px" onclick="saveProgram()">Saglabāt programmu</button></div>`}function dayEditor(d,di){return `<div class=daybox><div class=row><input value="${E(d.name)}" onchange="editingProgram.days[${di}].name=this.value"><button class=danger onclick="delDay(${di})">Dzēst dienu</button></div>${d.ex.map((e,ei)=>`<div class=exercise-row><b>${ei+1}</b><div><input value="${E(e.name)}" placeholder="Vingrinājums" onchange="editingProgram.days[${di}].ex[${ei}].name=this.value"><div class=row><input type=number min=1 max=10 value="${e.sets}" onchange="editingProgram.days[${di}].ex[${ei}].sets=+this.value" title="Seti"><input value="${E(e.reps)}" onchange="editingProgram.days[${di}].ex[${ei}].reps=this.value" placeholder="12/12/10/10"></div></div><button class=secondary onclick="moveEx(${di},${ei},-1)">↑</button><button class=secondary onclick="moveEx(${di},${ei},1)">↓</button><button class=danger onclick="delEx(${di},${ei})">×</button></div>`).join('')}<button class=secondary onclick="addEx(${di})">+ Vingrinājums</button></div>`}function addDay(){editingProgram.days.push({name:'Jauna diena',ex:[]});render()}function delDay(i){editingProgram.days.splice(i,1);render()}function addEx(di){editingProgram.days[di].ex.push({name:'',sets:4,reps:'12/12/10/10'});render()}function delEx(di,ei){editingProgram.days[di].ex.splice(ei,1);render()}function moveEx(di,ei,x){let a=editingProgram.days[di].ex,j=ei+x;if(j<0||j>=a.length)return;[a[ei],a[j]]=[a[j],a[ei]];render()}function saveProgram(){editingProgram.name=pname.value.trim();if(!editingProgram.name)return alert('Ievadi programmas nosaukumu.');let i=db.programs.findIndex(p=>p.id===editingProgram.id);if(i>=0)db.programs[i]=editingProgram;else db.programs.push(editingProgram);save();go('programs')}function copyProgram(id){let p=JSON.parse(JSON.stringify(prog(id)));p.id=crypto.randomUUID();p.name+=' kopija';db.programs.push(p);save();render()}
function groups(){app.innerHTML=`<div class=row><h1>Grupas</h1><button onclick="groupForm()">+ Grupa</button></div>${db.groups.map(g=>`<div class=card><h3>${E(g.name)}</h3><p class=muted>${g.clientIds.map(clientName).join(' + ')}</p><span class=tag>${E(prog(g.programId)?.name||'Nav programmas')}</span>${prog(g.programId)?'<p>'+prog(g.programId).days.map(d=>`<button style="margin:3px" onclick="startGroup('${g.id}','${E(d.name)}')">${E(d.name)}</button>`).join('')+'</p>':''}</div>`).join('')||'<div class=empty>Nav grupu.</div>'}`};function groupForm(){dlgOpen(`<h2>Jauna grupa</h2><label>Nosaukums</label><input id=gn><label>Dalībnieki</label>${db.clients.map(c=>`<label><input style="width:auto" class=gm type=checkbox value="${c.id}"> ${E(c.name)}</label>`).join('')}<label>Programma</label><select id=gp>${db.programs.map(p=>`<option value="${p.id}">${E(p.name)}</option>`).join('')}</select><button onclick="addGroup()">Saglabāt</button>`)}function addGroup(){let ids=[...document.querySelectorAll('.gm:checked')].map(x=>x.value);if(ids.length<2)return alert('Izvēlies vismaz 2 klientus.');db.groups.push({id:crypto.randomUUID(),name:gn.value.trim()||ids.map(clientName).join(' + '),clientIds:ids,programId:gp.value});save();dlgClose();render()}
function calendar(){let ev=[...db.events].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));app.innerHTML=`<div class=row><h1>Kalendārs</h1><button onclick="eventForm(false)">+ Klients</button><button onclick="eventForm(true)">+ Grupa</button></div>${ev.map(e=>`<div class="card appt ${sameTimeCount(e)>1?'conflict':''}"><div><b>${E(e.date)}</b><div class=time>${E(e.time)}</div></div><div><b>${E(eventTitle(e))}</b><br><span class=tag>${E(e.day)}</span>${sameTimeCount(e)>1?'<div style="color:var(--amber)">⚠ Laika konflikts</div>':''}</div><button class=danger onclick="deleteEvent('${e.id}')">×</button></div>`).join('')||'<div class=empty>Nav pierakstu.</div>'}`}
function eventForm(group){let opts=group?db.groups:db.clients;dlgOpen(`<h2>${group?'Grupas':'Klienta'} pieraksts</h2><label>${group?'Grupa':'Klients'}</label><select id=who onchange="fillEventDays(${group})">${opts.map(x=>`<option value="${x.id}">${E(x.name)}</option>`).join('')}</select><label>Treniņš</label><select id=eday></select><div class=row><div><label>Datums</label><input id=ed type=date value="${today()}" onchange="checkSlot()"></div><div><label>Laiks</label><input id=et type=time value="10:00" onchange="checkSlot()"></div></div><div id=slotInfo></div><button onclick="addEvent(${group})">Saglabāt pierakstu</button>`);fillEventDays(group);checkSlot()}function fillEventDays(group){let x=(group?db.groups:db.clients).find(y=>y.id===who.value),p=prog(x?.programId);eday.innerHTML=(p?.days||[]).map(d=>`<option>${E(d.name)}</option>`).join('')}function checkSlot(){if(!window.ed||!window.et)return;let hit=db.events.find(e=>e.date===ed.value&&e.time===et.value);slotInfo.innerHTML=hit?`<div class="card conflict">⚠ ${E(et.value)} jau aizņemts: <b>${E(eventTitle(hit))}</b></div>`:`<p class=ok>✓ Laiks ir brīvs</p>`}function addEvent(group){let hit=db.events.find(e=>e.date===ed.value&&e.time===et.value);if(hit)return alert('Šis laiks jau ir aizņemts: '+eventTitle(hit)+'. Izvēlies citu laiku.');db.events.push({id:crypto.randomUUID(),[group?'groupId':'clientId']:who.value,day:eday.value,date:ed.value,time:et.value,done:false});save();dlgClose();render()}function deleteEvent(id){db.events=db.events.filter(e=>e.id!==id);save();render()}
function history(){app.innerHTML=`<div class=row><h1>Vēsture</h1><button onclick="exportData()">Eksportēt</button></div><p class=muted>Izvēlies klienta mapi, lai apskatītu visus pabeigtos treniņus.</p>${db.clients.map(c=>{let n=db.sessions.filter(s=>s.clientId===c.id).length;return `<div class="card folder" onclick="openHistory('${c.id}')"><div class=row><div><h3>📁 ${E(c.name)}</h3><small>${n} pabeigti treniņi</small></div><button class=secondary>Atvērt</button></div></div>`}).join('')}<div class=card><label>Importēt rezerves kopiju</label><input type=file accept=.json onchange="importData(this.files[0])"></div>`}function openHistory(id){selectedClient=id;page='clientHistory';render()}function clientHistory(){let a=db.sessions.filter(s=>s.clientId===selectedClient).sort((a,b)=>b.date.localeCompare(a.date));app.innerHTML=`<button class=secondary onclick="go('history')">← Mapes</button><h1>${E(clientName(selectedClient))}</h1>${a.map(s=>`<div class="card folder" onclick="openSession('${s.id}')"><h3>${E(s.day)} · ${E(s.date)}</h3><p class=muted>${E(s.programName)}${s.groupName?' · Grupa: '+E(s.groupName):''}</p><small>${s.exercises.length} vingrinājumi</small></div>`).join('')||'<div class=empty>Nav pabeigtu treniņu.</div>'}`};function openSession(id){selectedSession=id;page='sessionDetail';render()}function sessionDetail(){let s=db.sessions.find(x=>x.id===selectedSession);app.innerHTML=`<button class=secondary onclick="openHistory('${s.clientId}')">← Atpakaļ</button><div class="card hero"><small>${E(s.programName)}</small><h1>${E(clientName(s.clientId))} · ${E(s.day)}</h1><p>${E(s.date)}</p></div>${s.exercises.map(e=>`<div class=card><h3>${E(e.name)}</h3>${e.sets.map((x,i)=>`<div class=prev><b>${i+1}.</b><span>${E(x.kg||'–')} kg</span><span>× ${E(x.reps||'–')}</span></div>`).join('')}</div>`).join('')}`}
function previous(cid,n){for(let s of [...db.sessions].reverse()){if(s.clientId===cid){let e=s.exercises.find(x=>x.name===n);if(e)return e}}}function start(cid,day){let c=db.clients.find(x=>x.id===cid),p=prog(c.programId),d=p?.days.find(x=>x.name===day);if(!d)return;current={id:crypto.randomUUID(),clientId:cid,programId:p.id,programName:p.name,day,date:today(),exercises:d.ex.map(e=>({name:e.name,targetReps:e.reps,sets:Array.from({length:e.sets||4},()=>({kg:'',reps:''}))}))};page='workout';render()}function workout(){let c=db.clients.find(x=>x.id===current.clientId);app.innerHTML=`<button class=secondary onclick="go('home')">← Iziet</button><div class="card hero"><small>${E(current.programName)}</small><h1>${E(c.name)} · ${E(current.day)}</h1><p>${E(current.date)}</p></div>${current.exercises.map((e,i)=>exerciseCard(e,i,current.clientId)).join('')}<button style="width:100%" onclick="finish()">Pabeigt un saglabāt</button>`}function exerciseCard(e,i,cid){let p=previous(cid,e.name),valid=p?.sets.filter(x=>x.kg||x.reps)||[];return `<div class=card><div class=row><h3>${E(e.name)}</h3><button class=secondary onclick="renameEx(${i})">Mainīt</button></div><small>Mērķis: ${E(e.targetReps||'')}</small>${valid.length?`<div class=daybox><b>Iepriekšējais treniņš</b>${valid.map((x,j)=>`<div class=prev><b>${j+1}.</b><span>${E(x.kg||'–')} kg</span><span>× ${E(x.reps||'–')}</span></div>`).join('')}</div>`:''}${e.sets.map((s,j)=>`<div class=sets><b>${j+1}.</b><input placeholder=kg inputmode=decimal value="${E(s.kg)}" onchange="current.exercises[${i}].sets[${j}].kg=this.value"><input placeholder=reizes inputmode=numeric value="${E(s.reps)}" onchange="current.exercises[${i}].sets[${j}].reps=this.value"><button class=danger onclick="delSet(${i},${j})">×</button></div>`).join('')}<button class=secondary onclick="addSet(${i})">+ Sets</button></div>`}function addSet(i){current.exercises[i].sets.push({kg:'',reps:''});render()}function delSet(i,j){current.exercises[i].sets.splice(j,1);render()}function renameEx(i){let n=prompt('Jaunais vingrinājums',current.exercises[i].name);if(n){current.exercises[i].name=n;render()}}function finish(){db.sessions.push(current);current=null;save();go('history')}
function startGroup(gid,day){let g=db.groups.find(x=>x.id===gid),p=prog(g.programId),d=p?.days.find(x=>x.name===day);if(!d)return;current={id:crypto.randomUUID(),groupId:gid,groupName:g.name,clientIds:g.clientIds,programId:p.id,programName:p.name,day,date:today(),exercises:d.ex.map(e=>({name:e.name,targetReps:e.reps,clients:Object.fromEntries(g.clientIds.map(cid=>[cid,{sets:Array.from({length:e.sets||4},()=>({kg:'',reps:''}))}]))}))};page='groupWorkout';render()}function groupWorkout(){app.innerHTML=`<button class=secondary onclick="go('groups')">← Iziet</button><div class="card hero"><small>${E(current.programName)}</small><h1>${E(current.groupName)} · ${E(current.day)}</h1></div>${current.exercises.map((e,ei)=>`<div class=card><h3>${E(e.name)}</h3><small>Mērķis: ${E(e.targetReps)}</small><div class="grid two">${current.clientIds.map(cid=>`<div class=daybox><h3>${E(clientName(cid))}</h3>${e.clients[cid].sets.map((s,si)=>`<div class=sets><b>${si+1}.</b><input placeholder=kg inputmode=decimal onchange="current.exercises[${ei}].clients['${cid}'].sets[${si}].kg=this.value"><input placeholder=reizes inputmode=numeric onchange="current.exercises[${ei}].clients['${cid}'].sets[${si}].reps=this.value"><button class=danger onclick="delGSet(${ei},'${cid}',${si})">×</button></div>`).join('')}<button class=secondary onclick="addGSet(${ei},'${cid}')">+ Sets</button></div>`).join('')}</div></div>`).join('')}<button style="width:100%" onclick="finishGroup()">Pabeigt grupas treniņu</button>`}function addGSet(e,c){current.exercises[e].clients[c].sets.push({kg:'',reps:''});render()}function delGSet(e,c,s){current.exercises[e].clients[c].sets.splice(s,1);render()}function finishGroup(){let gid=current.id;current.clientIds.forEach(cid=>db.sessions.push({id:crypto.randomUUID(),groupSessionId:gid,groupName:current.groupName,clientId:cid,programId:current.programId,programName:current.programName,day:current.day,date:current.date,exercises:current.exercises.map(e=>({name:e.name,sets:e.clients[cid].sets}))}));current=null;save();go('history')}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='brakofit-v5-backup.json';a.click()}function importData(f){let r=new FileReader();r.onload=()=>{try{db=migrate(JSON.parse(r.result));save();render();alert('Dati importēti.')}catch(e){alert('Nederīgs fails.')}};r.readAsText(f)}function dlgOpen(x){dlg.innerHTML=x+'<p><button class=secondary onclick="dlgClose()">Aizvērt</button></p>';dlg.showModal()}function dlgClose(){dlg.close()}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();
</script></body></html>
