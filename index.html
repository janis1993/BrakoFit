<!doctype html><html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b10"><link rel="manifest" href="manifest.json"><title>BrakoFit V5.5 Stable</title><style>
:root{--bg:#080b10;--p:#111923;--p2:#17212e;--line:#2b3747;--text:#f4f6f8;--muted:#97a3b3;--green:#75df8b;--green2:#184329;--red:#ff7d87}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:8;background:#0a1017ee;padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}header b{font-size:22px;color:var(--green)}main{max-width:980px;margin:auto;padding:18px 14px calc(125px + env(safe-area-inset-bottom))}.card{background:linear-gradient(145deg,var(--p2),var(--p));border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.hero{background:linear-gradient(135deg,#143a24,#111a24)}h1,h2,h3{margin:.25em 0 .65em}.muted,small{color:var(--muted)}button{border:0;border-radius:11px;padding:11px 13px;background:var(--green);color:#07120a;font-weight:800}.sec{background:var(--p2);color:var(--text);border:1px solid var(--line)}.danger{background:#431d25;color:#ffadb4}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.grid{display:grid;gap:10px}.two{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}input,select,textarea{width:100%;background:#0a1119;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}label{display:block;font-size:13px;font-weight:750;margin:9px 0 4px}.tag{display:inline-block;background:var(--green2);color:#b7f5c1;padding:4px 8px;border-radius:18px;font-size:12px}.sets{display:grid;grid-template-columns:30px 1fr 1fr 38px;gap:7px;align-items:center;margin:7px 0}.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:900;padding:8px 12px;border-radius:11px;background:#153a25;color:var(--green);text-align:center}.timer.orange{background:#4a3218;color:#ffad45}.timer.red{background:#491a22;color:var(--red)}.active{border-color:#39734c;background:#143724}.appt{display:grid;grid-template-columns:112px 1fr auto;gap:14px;align-items:center}.date{font-weight:850;white-space:nowrap}.time{font-size:28px;font-weight:900;color:var(--green)}.name{font-size:20px;font-weight:850}.appt-actions{display:grid;gap:6px}.collapse-head{width:100%;display:flex;justify-content:space-between;align-items:center;background:transparent;color:var(--text);padding:0;text-align:left}.collapsed{display:none}.day{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:#0c131b}.day-list{margin-top:10px}.exercise{display:grid;grid-template-columns:30px 1fr;gap:8px;margin:8px 0}.workbar{position:sticky;bottom:calc(62px + env(safe-area-inset-bottom));z-index:17;background:#0b1118f2;border:1px solid var(--line);border-radius:15px;padding:10px;display:grid;grid-template-columns:1fr 1.25fr;gap:8px;box-shadow:0 -8px 25px #0008}.empty{text-align:center;color:var(--muted);padding:28px}nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#0b1118;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:4px 1px calc(4px + env(safe-area-inset-bottom))}nav button{background:none;color:var(--muted);font-size:9px;padding:5px 0;min-width:0;white-space:nowrap;overflow:hidden}nav button.on{color:var(--green)}nav span{display:block;font-size:18px;line-height:21px}dialog{width:min(570px,95%);max-height:90vh;overflow:auto;background:var(--p);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:17px}dialog::backdrop{background:#000c}@media(max-width:430px){.appt{grid-template-columns:105px 1fr auto;gap:10px}}@media(min-width:760px){nav{top:62px;bottom:0;right:auto;width:150px;display:flex;flex-direction:column}main{padding-left:170px}.workbar{bottom:16px}}</style></head><body><header><b>BrakoFit V5.5 Stable</b><small>Mobile</small></header><nav id="nav"></nav><main id="app"></main><dialog id="dlg"></dialog><script>
const app=document.getElementById('app'),nav=document.getElementById('nav'),dlg=document.getElementById('dlg');const KEY='brakofit-v55',ACTIVE='brakofit-active-v55';const seed={version:5.5,clients:[],programs:[],groups:[],events:[],sessions:[],settings:{orangeMin:70,redMin:85}};function migrate(x){x=x||seed;x.clients=x.clients||[];x.programs=x.programs||[];x.groups=x.groups||[];x.events=x.events||[];x.sessions=x.sessions||[];x.settings=x.settings||{orangeMin:70,redMin:85};x.programs.forEach(p=>(p.days||[]).forEach(d=>d.ex=(d.ex||[]).map(e=>typeof e==='string'?{name:e,sets:4,reps:'12/12/10/10'}:{sets:4,reps:'12/12/10/10',...e})));return x}let raw=localStorage.getItem(KEY)||localStorage.getItem('brakofit-v54')||localStorage.getItem('brakofit-v53')||localStorage.getItem('brakofit-v52')||localStorage.getItem('brakofit-v5')||localStorage.getItem('brakofit-v3'),db=migrate(raw?JSON.parse(raw):null),current=null;try{current=JSON.parse(localStorage.getItem(ACTIVE)||localStorage.getItem('brakofit-active-v54')||'null')}catch(e){}let page='home',cid=null,sid=null,tick=null,editingProgram=null;const save=()=>localStorage.setItem(KEY,JSON.stringify(db)),saveActive=()=>current?localStorage.setItem(ACTIVE,JSON.stringify(current)):localStorage.removeItem(ACTIVE),E=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),P=id=>db.programs.find(x=>x.id===id),C=id=>db.clients.find(x=>x.id===id),G=id=>db.groups.find(x=>x.id===id),today=()=>new Date().toISOString().slice(0,10);save();const T=[['home','⌂','Sākums'],['clients','♙','Klienti'],['programs','▤','Prog.'],['groups','◎','Grupas'],['calendar','▣','Kal.'],['history','↻','Vēst.'],['settings','⚙','Iestat.']];function go(x){page=x;render()}function render(){clearInterval(tick);nav.innerHTML=T.map(x=>`<button class=${page===x[0]?'on':''} onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');({home,clients,programs,groups,calendar,history,settings,workout,groupWorkout,clientHistory,detail}[page]||home)();if(current&&!['workout','groupWorkout'].includes(page))app.insertAdjacentHTML('afterbegin',banner())}function elapsed(){return current?.startedAt?Math.floor((Date.now()-current.startedAt)/1000):0}function fmt(s){let h=s/3600|0,m=s%3600/60|0,z=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(z).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(z).padStart(2,'0')}`}function tc(){let m=elapsed()/60;return m>=db.settings.redMin?'red':m>=db.settings.orangeMin?'orange':''}function timer(){return `<div id=timer class="timer ${tc()}">${fmt(elapsed())}</div>`}function run(){tick=setInterval(()=>{let x=document.getElementById('timer');if(x){x.textContent=fmt(elapsed());x.className='timer '+tc()}},1000)}function banner(){return `<div class="card active row"><div><b>Aktīvs treniņš</b><br><small>${E(current.groupName||C(current.clientId)?.name)} · ${E(current.day)}</small></div>${timer()}<button onclick="page=current.groupId?'groupWorkout':'workout';render()">Turpināt</button></div>`}
function home(){let es=db.events.filter(e=>e.date===today()).sort((a,b)=>a.time.localeCompare(b.time));app.innerHTML=`<div class="card hero"><small>${new Date().toLocaleDateString('lv-LV',{weekday:'long'}).toUpperCase()}</small><h1>${new Date().toLocaleDateString('lv-LV')}</h1></div><h2>Šodienas grafiks</h2>${es.map(e=>`<div class=card><b>${E(e.time)} · ${E(eventName(e))}</b> <span class=tag>${E(e.day)}</span></div>`).join('')||'<div class=empty>Šodien nav pierakstu.</div>'}`}function eventName(e){return e.groupId?G(e.groupId)?.name:C(e.clientId)?.name}
function clients(){app.innerHTML=`<div class=row><h1>Klienti</h1><button onclick="clientForm()">+ Klients</button></div>${db.clients.map(c=>`<div class=card><h3>${E(c.name)}</h3><p class=muted>${E(P(c.programId)?.name||'Nav programmas')}</p><div class=row><button class=sec onclick="chooseDay('${c.id}')">Sākt</button><button class=sec onclick="openHist('${c.id}')">Vēsture</button><button class=sec onclick="assign('${c.id}')">Programma</button></div></div>`).join('')}`}function clientForm(){pop(`<h2>Jauns klients</h2><input id=cn placeholder="Vārds"><label>Programma</label><select id=cp><option value="">Bez programmas</option>${db.programs.map(p=>`<option value=${p.id}>${E(p.name)}</option>`)}</select><button onclick="db.clients.push({id:crypto.randomUUID(),name:el('cn').value,programId:el('cp').value});save();closeD();render()">Saglabāt</button>`)}function assign(id){pop(`<h2>Programma</h2><select id=ap>${db.programs.map(p=>`<option value=${p.id} ${C(id).programId===p.id?'selected':''}>${E(p.name)}</option>`)}</select><button onclick="C('${id}').programId=el('ap').value;save();closeD();render()">Saglabāt</button>`)}function chooseDay(id){let p=P(C(id).programId);if(!p)return alert('Nav programmas');pop(`<h2>Izvēlies treniņu</h2>${p.days.map(d=>`<button style="margin:4px" onclick="closeD();start('${id}','${E(d.name)}')">${E(d.name)}</button>`).join('')}`)}
function programs(){app.innerHTML=`<div class=row><h1>Programmas</h1><button onclick="progForm()">+ Programma</button></div>${db.programs.map((p,pi)=>`<div class=card><button class=collapse-head onclick="toggle('prog-${pi}',this)"><span><b>${E(p.name)}</b><br><small>${p.days.length} treniņu dienas</small></span><span>▶</span></button><div id=prog-${pi} class=collapsed><div class=row><button class=sec onclick="progForm('${p.id}')">Rediģēt</button><button class=sec onclick="copyProg('${p.id}')">Kopēt</button></div>${p.days.map((d,di)=>`<div class=day><button class=collapse-head onclick="toggle('day-${pi}-${di}',this)"><b>${E(d.name)} · ${d.ex.length} vingr.</b><span>▶</span></button><div id=day-${pi}-${di} class="collapsed day-list">${d.ex.map((e,i)=>`<div class=exercise><b>${i+1}.</b><div>${E(e.name)}<br><small>${e.sets} seti · ${E(e.reps)}</small></div></div>`).join('')}</div></div>`).join('')}</div></div>`).join('')}`}function toggle(id,b){let x=el(id);x.classList.toggle('collapsed');b.lastElementChild.textContent=x.classList.contains('collapsed')?'▶':'▼'}function copyProg(id){let p=JSON.parse(JSON.stringify(P(id)));p.id=crypto.randomUUID();p.name+=' kopija';db.programs.push(p);save();render()}function progForm(id){editingProgram=id?JSON.parse(JSON.stringify(P(id))):{id:crypto.randomUUID(),name:'',days:[{name:'Treniņš',ex:[]}]};drawProg()}function drawProg(){pop(`<h2>Programmas redaktors</h2><input id=pn value="${E(editingProgram.name)}" onchange="editingProgram.name=this.value">${editingProgram.days.map((d,di)=>`<div class=card><input value="${E(d.name)}" onchange="editingProgram.days[${di}].name=this.value">${d.ex.map((e,ei)=>`<div class=sets><b>${ei+1}</b><input value="${E(e.name)}" onchange="editingProgram.days[${di}].ex[${ei}].name=this.value"><input value="${E(e.reps)}" onchange="editingProgram.days[${di}].ex[${ei}].reps=this.value"><button class=danger onclick="editingProgram.days[${di}].ex.splice(${ei},1);drawProg()">×</button></div>`).join('')}<button class=sec onclick="editingProgram.days[${di}].ex.push({name:'',sets:4,reps:'12/12/10/10'});drawProg()">+ Vingrinājums</button></div>`).join('')}<button class=sec onclick="editingProgram.days.push({name:'Jauna diena',ex:[]});drawProg()">+ Diena</button><button onclick="editingProgram.name=el('pn').value;let i=db.programs.findIndex(x=>x.id===editingProgram.id);i<0?db.programs.push(editingProgram):db.programs[i]=editingProgram;save();closeD();render()">Saglabāt</button>`)}
function groups(){app.innerHTML=`<div class=row><h1>Grupas</h1><button onclick="groupForm()">+ Grupa</button></div>${db.groups.map(g=>`<div class=card><h3>${E(g.name)}</h3><p class=muted>${g.clientIds.map(id=>E(C(id)?.name)).join(' + ')}</p><span class=tag>${E(P(g.programId)?.name||'Nav programmas')}</span><div class=row style="margin-top:12px"><button class=sec onclick="groupForm('${g.id}')">Rediģēt</button><button class=danger onclick="deleteGroup('${g.id}')">Dzēst</button></div><p>${(P(g.programId)?.days||[]).map(d=>`<button style="margin:3px" onclick="startGroup('${g.id}','${E(d.name)}')">${E(d.name)}</button>`).join('')}</p></div>`).join('')||'<div class=empty>Nav grupu.</div>'}`}function groupForm(id){let g=id?G(id):null;pop(`<h2>${g?'Rediģēt':'Jauna'} grupa</h2><input id=gn value="${E(g?.name||'')}">${db.clients.map(c=>`<label><input class=gm style="width:auto" type=checkbox value=${c.id} ${g?.clientIds.includes(c.id)?'checked':''}> ${E(c.name)}</label>`).join('')}<select id=gp>${db.programs.map(p=>`<option value=${p.id} ${g?.programId===p.id?'selected':''}>${E(p.name)}</option>`)}</select><button onclick="saveGroup('${id||''}')">Saglabāt</button>`)}function saveGroup(id){let ids=[...document.querySelectorAll('.gm:checked')].map(x=>x.value);if(ids.length<2)return alert('Izvēlies vismaz 2 klientus');let g=id?G(id):null;if(g){g.name=el('gn').value;g.clientIds=ids;g.programId=el('gp').value}else db.groups.push({id:crypto.randomUUID(),name:el('gn').value,clientIds:ids,programId:el('gp').value});save();closeD();render()}function deleteGroup(id){if(!confirm('Vai tiešām dzēst šo grupu?'))return;db.groups=db.groups.filter(x=>x.id!==id);db.events=db.events.filter(e=>e.groupId!==id);save();render()}
function calendar(){let es=[...db.events].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));app.innerHTML=`<div class=row><h1>Kalendārs</h1><button onclick="eventForm(false)">+ Klients</button><button onclick="eventForm(true)">+ Grupa</button></div>${es.map(e=>`<div class=card appt><div><div class=date>${pretty(e.date)}</div><div class=time>${E(e.time)}</div></div><div><div class=name>${E(eventName(e))}</div><span class=tag>${E(e.day)}</span>${e.customExercises?.length?'<p><small>Pielāgots treniņš</small></p>':''}</div><div class=appt-actions><button class=sec onclick="editEvent('${e.id}')">✎</button><button class=danger onclick="deleteEvent('${e.id}')">×</button></div></div>`).join('')||'<div class=empty>Nav pierakstu.</div>'}`}function pretty(v){let [y,m,d]=v.split('-');return `${d}.${m}.${y}`}function eventForm(group){let list=group?db.groups:db.clients;pop(`<h2>Pieraksts</h2><select id=who onchange="eventDays(${group})">${list.map(x=>`<option value=${x.id}>${E(x.name)}</option>`)}</select><select id=eday></select><input id=ed type=date value=${today()}><input id=et type=time value=10:00><button onclick="addEvent(${group})">Saglabāt</button>`);eventDays(group)}function eventDays(group){let x=(group?db.groups:db.clients).find(y=>y.id===el('who').value),p=P(x?.programId);el('eday').innerHTML=(p?.days||[]).map(d=>`<option>${E(d.name)}</option>`).join('')}function addEvent(group){if(db.events.some(e=>e.date===el('ed').value&&e.time===el('et').value))return alert('Laiks aizņemts');db.events.push({id:crypto.randomUUID(),[group?'groupId':'clientId']:el('who').value,day:el('eday').value,date:el('ed').value,time:el('et').value,done:false});save();closeD();render()}function editEvent(id){let e=db.events.find(x=>x.id===id),owner=e.groupId?G(e.groupId):C(e.clientId),p=P(owner?.programId),day=p?.days.find(x=>x.name===e.day),ex=e.customExercises?JSON.parse(JSON.stringify(e.customExercises)):JSON.parse(JSON.stringify(day?.ex||[]));window.ee=e;window.eex=ex;drawEventEdit()}function drawEventEdit(){pop(`<h2>Rediģēt treniņu</h2><label>Datums</label><input id=eed type=date value=${ee.date}><label>Laiks</label><input id=eet type=time value=${ee.time}><label>Treniņa diena</label><select id=eey onchange="loadEventDay()">${(P((ee.groupId?G(ee.groupId):C(ee.clientId))?.programId)?.days||[]).map(d=>`<option ${d.name===ee.day?'selected':''}>${E(d.name)}</option>`)}</select><h3>Šī treniņa vingrinājumi</h3>${eex.map((x,i)=>`<div class=sets><b>${i+1}</b><input value="${E(x.name)}" onchange="eex[${i}].name=this.value"><input value="${E(x.reps||'')}" onchange="eex[${i}].reps=this.value"><button class=danger onclick="eex.splice(${i},1);drawEventEdit()">×</button></div>`).join('')}<button class=sec onclick="eex.push({name:'',sets:4,reps:'12/12/10/10'});drawEventEdit()">+ Vingrinājums</button><button onclick="saveEventEdit()">Saglabāt tikai šim treniņam</button>`)}function loadEventDay(){let owner=ee.groupId?G(ee.groupId):C(ee.clientId),d=P(owner.programId)?.days.find(x=>x.name===el('eey').value);eex=JSON.parse(JSON.stringify(d?.ex||[]));drawEventEdit()}function saveEventEdit(){if(db.events.some(x=>x.id!==ee.id&&x.date===el('eed').value&&x.time===el('eet').value))return alert('Laiks aizņemts');ee.date=el('eed').value;ee.time=el('eet').value;ee.day=el('eey').value;ee.customExercises=JSON.parse(JSON.stringify(eex));save();closeD();render()}function deleteEvent(id){if(!confirm('Dzēst pierakstu?'))return;db.events=db.events.filter(x=>x.id!==id);save();render()}
function history(){app.innerHTML=`<h1>Vēsture</h1>${db.clients.map(c=>`<div class=card onclick="openHist('${c.id}')"><h3>📁 ${E(c.name)}</h3><small>${db.sessions.filter(s=>s.clientId===c.id).length} treniņi</small></div>`).join('')}<button onclick="backup()">Eksportēt</button><label>Importēt</label><input type=file onchange="restore(this.files[0])">`}function openHist(id){cid=id;page='clientHistory';render()}function clientHistory(){let ss=db.sessions.filter(x=>x.clientId===cid).sort((a,b)=>b.date.localeCompare(a.date));app.innerHTML=`<button class=sec onclick="go('history')">← Mapes</button><h1>${E(C(cid)?.name)}</h1>${ss.map(s=>`<div class=card onclick="sid='${s.id}';page='detail';render()"><h3>${E(s.day)} · ${E(s.date)}</h3><small>${s.exercises.length} vingrinājumi${s.durationSec?' · '+fmt(s.durationSec):''}</small></div>`).join('')||'<div class=empty>Nav treniņu</div>'}`}function detail(){let s=db.sessions.find(x=>x.id===sid);app.innerHTML=`<button class=sec onclick="openHist('${s.clientId}')">← Atpakaļ</button><h1>${E(s.day)} · ${E(s.date)}</h1>${s.exercises.map(e=>`<div class=card><h3>${E(e.name)}</h3>${e.sets.map((x,i)=>`<p>${i+1}. <b>${E(x.kg||'–')}</b> kg × <b>${E(x.reps||'–')}</b> reizes</p>`).join('')}</div>`).join('')}`}
function start(clientId,day,eventId=null){let c=C(clientId),p=P(c.programId),e=eventId?db.events.find(x=>x.id===eventId):null,d=p.days.find(x=>x.name===day),ex=e?.customExercises||d.ex;current={id:crypto.randomUUID(),startedAt:Date.now(),eventId,clientId,programName:p.name,day,date:today(),exercises:ex.map(x=>({name:x.name,targetReps:x.reps,sets:Array.from({length:x.sets||4},()=>({kg:'',reps:''}))}))};saveActive();page='workout';render()}function workout(){app.innerHTML=`<button class=sec onclick="go('home')">← Iziet</button><div class="card hero row"><div><h1>${E(C(current.clientId)?.name)} · ${E(current.day)}</h1></div>${timer()}</div>${current.exercises.map((e,i)=>exCard(e,i)).join('')}<div class=workbar><button class=sec onclick="addEx()">+ Vingrinājums</button><button onclick="finish()">Pabeigt treniņu</button></div>`;run()}function exCard(e,i){return `<div class=card><div class=row><h3>${E(e.name)}</h3><button class=danger onclick="if(confirm('Dzēst vingrinājumu?')){current.exercises.splice(${i},1);saveActive();render()}">Dzēst</button></div>${e.sets.map((s,j)=>`<div class=sets><b>${j+1}</b><input placeholder=kg value="${E(s.kg)}" onchange="current.exercises[${i}].sets[${j}].kg=this.value;saveActive()"><input placeholder=reizes value="${E(s.reps)}" onchange="current.exercises[${i}].sets[${j}].reps=this.value;saveActive()"><button class=danger onclick="current.exercises[${i}].sets.splice(${j},1);saveActive();render()">×</button></div>`).join('')}</div>`}function addEx(){current.exercises.push({name:prompt('Vingrinājuma nosaukums')||'Jauns vingrinājums',sets:Array.from({length:4},()=>({kg:'',reps:''}))});saveActive();render()}function finish(){if(!confirm('Pabeigt treniņu?'))return;current.durationSec=elapsed();db.sessions.push(current);if(current.eventId){let e=db.events.find(x=>x.id===current.eventId);if(e)e.done=true}current=null;localStorage.removeItem(ACTIVE);save();go('history')}
function startGroup(groupId,day,eventId=null){let g=G(groupId),p=P(g.programId),ev=eventId?db.events.find(x=>x.id===eventId):null,d=p.days.find(x=>x.name===day),ex=ev?.customExercises||d.ex;current={id:crypto.randomUUID(),startedAt:Date.now(),eventId,groupId,groupName:g.name,clientIds:g.clientIds,programName:p.name,day,date:today(),exercises:ex.map(x=>({name:x.name,clients:Object.fromEntries(g.clientIds.map(c=>[c,{sets:Array.from({length:x.sets||4},()=>({kg:'',reps:''}))}]))}))};saveActive();page='groupWorkout';render()}function groupWorkout(){app.innerHTML=`<button class=sec onclick="go('home')">← Iziet</button><div class="card hero row"><h1>${E(current.groupName)} · ${E(current.day)}</h1>${timer()}</div>${current.exercises.map((e,i)=>`<div class=card><h3>${E(e.name)}</h3><div class="grid two">${current.clientIds.map(c=>`<div class=card><b>${E(C(c)?.name)}</b>${e.clients[c].sets.map((x,j)=>`<div class=sets><b>${j+1}</b><input placeholder=kg onchange="current.exercises[${i}].clients['${c}'].sets[${j}].kg=this.value;saveActive()"><input placeholder=reizes onchange="current.exercises[${i}].clients['${c}'].sets[${j}].reps=this.value;saveActive()"><span></span></div>`).join('')}</div>`).join('')}</div></div>`).join('')}<div class=workbar><span></span><button onclick="finishGroup()">Pabeigt grupas treniņu</button></div>`;run()}function finishGroup(){if(!confirm('Pabeigt grupas treniņu?'))return;let du=elapsed();current.clientIds.forEach(c=>db.sessions.push({id:crypto.randomUUID(),clientId:c,groupName:current.groupName,programName:current.programName,day:current.day,date:current.date,durationSec:du,exercises:current.exercises.map(e=>({name:e.name,sets:e.clients[c].sets}))}));current=null;localStorage.removeItem(ACTIVE);save();go('history')}
function settings(){app.innerHTML=`<h1>Iestatījumi</h1><div class=card><label>Oranžs no minūtes</label><input id=om type=number value=${db.settings.orangeMin}><label>Sarkans no minūtes</label><input id=rm type=number value=${db.settings.redMin}><button onclick="db.settings={orangeMin:+el('om').value,redMin:+el('rm').value};save();render()">Saglabāt</button></div>`}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='brakofit-v55-backup.json';a.click()}function restore(f){let r=new FileReader;r.onload=()=>{db=migrate(JSON.parse(r.result));save();render()};r.readAsText(f)}function el(id){return document.getElementById(id)}function pop(x){dlg.innerHTML=x+'<p><button class=sec onclick="closeD()">Aizvērt</button></p>';dlg.showModal()}function closeD(){dlg.close()}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();
</script></body></html>
