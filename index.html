const seed={version:5.1,clients:[],programs:[],groups:[],events:[],sessions:[],settings:{orangeMin:70,redMin:85}};function mig(x){x=x||seed;x.settings=x.settings||{orangeMin:70,redMin:85};x.clients=x.clients||[];x.programs=x.programs||[];x.groups=x.groups||[];x.events=x.events||[];x.sessions=x.sessions||[];x.programs.forEach(p=>p.days?.forEach(y=>y.ex=(y.ex||[]).map(e=>typeof e==='string'?{name:e,sets:4,reps:'12/12/10/10'}:{sets:4,reps:'12/12/10/10',...e})));return x}let db=mig(JSON.parse(localStorage.getItem('brakofit-v51')||localStorage.getItem('brakofit-v5')||localStorage.getItem('brakofit-v3')||'null'));let cur=JSON.parse(localStorage.getItem('brakofit-active')||'null'),pg='home',cid=null,sid=null,tick=null;const S=()=>localStorage.setItem('brakofit-v51',JSON.stringify(db)),A=()=>cur?localStorage.setItem('brakofit-active',JSON.stringify(cur)):localStorage.removeItem('brakofit-active'),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),P=id=>db.programs.find(x=>x.id===id),C=id=>db.clients.find(x=>x.id===id),today=()=>new Date().toISOString().slice(0,10);S();

function start(id,day,eventId=null){if(cur&&!confirm('Atmest aktīvo treniņu?'))return;let p=P(C(id).programId),y=p.days.find(x=>x.name===day);cur={id:crypto.randomUUID(),startedAt:Date.now(),eventId,clientId:id,programName:p.name,day,date:today(),exercises:y.ex.map(e=>({name:e.name,targetReps:e.reps,sets:Array.from({length:e.sets||4},()=>({kg:'',reps:''}))}))};A();pg='workout';R()}function workout(){a.innerHTML=`<button class=sec onclick="go('home')">← Iziet</button><div class="card hero row"><div><small>${E(cur.programName)}</small><h1>${E(C(cur.clientId)?.name)} · ${E(cur.day)}</h1></div>${tm()}</div>${cur.exercises.map((e,i)=>exCard(e,i)).join('')}<button class=sec style="width:100%" onclick="addEx()">+ Pievienot vingrinājumu</button><button style="width:100%;margin-top:9px" onclick="finish()">Pabeigt treniņu</button>`;run()}function exCard(e,i){return `<div class=card><div class=row><h3>${E(e.name)}</h3><button class=sec onclick="let x=prompt('Nosaukums',cur.exercises[${i}].name);if(x){cur.exercises[${i}].name=x;A();R()}">Mainīt</button></div><small>Mērķis: ${E(e.targetReps)}</small>${e.sets.map((z,j)=>`<div class=sets><b>${j+1}.</b><input placeholder=kg value="${E(z.kg)}" onchange="cur.exercises[${i}].sets[${j}].kg=this.value;A()"><input placeholder=reizes value="${E(z.reps)}" onchange="cur.exercises[${i}].sets[${j}].reps=this.value;A()"><button class=del onclick="cur.exercises[${i}].sets.splice(${j},1);A();R()">×</button></div>`).join('')}<button class=sec onclick="cur.exercises[${i}].sets.push({kg:'',reps:''});A();R()">+ Sets</button></div>`}function addEx(){let x=prompt('Vingrinājuma nosaukums');if(x){cur.exercises.push({name:x,targetReps:'',sets:Array.from({length:4},()=>({kg:'',reps:''}))});A();R()}}function finish(){if(!confirm('Pabeigt un saglabāt treniņu?'))return;cur.durationSec=secs();if(cur.eventId){let e=db.events.find(x=>x.id===cur.eventId);if(e)e.done=true}db.sessions.push(cur);cur=null;A();S();go('history')}
function startGroup(id,day,eventId=null){let g=db.groups.find(x=>x.id===id),p=P(g.programId),y=p.days.find(x=>x.name===day);cur={id:crypto.randomUUID(),startedAt:Date.now(),eventId,groupId:id,groupName:g.name,clientIds:g.clientIds,programName:p.name,day,date:today(),exercises:y.ex.map(e=>({name:e.name,clients:Object.fromEntries(g.clientIds.map(c=>[c,{sets:Array.from({length:e.sets||4},()=>({kg:'',reps:''}))}]))}))};A();pg='groupWorkout';R()}function groupWorkout(){a.innerHTML=`<button class=sec onclick="go('home')">← Iziet</button><div class="card hero row"><h1>${E(cur.groupName)} · ${E(cur.day)}</h1>${tm()}</div>${cur.exercises.map((e,i)=>`<div class=card><h3>${E(e.name)}</h3><div class="grid two">${cur.clientIds.map(c=>`<div class=card><b>${E(C(c)?.name)}</b>${e.clients[c].sets.map((z,j)=>`<div class=sets><b>${j+1}</b><input placeholder=kg onchange="cur.exercises[${i}].clients['${c}'].sets[${j}].kg=this.value;A()"><input placeholder=reizes onchange="cur.exercises[${i}].clients['${c}'].sets[${j}].reps=this.value;A()"><span></span></div>`).join('')}</div>`).join('')}</div></div>`).join('')}<button style="width:100%" onclick="finishGroup()">Pabeigt grupas treniņu</button>`;run()}function finishGroup(){if(!confirm('Pabeigt grupas treniņu?'))return;let du=secs();cur.clientIds.forEach(c=>db.sessions.push({id:crypto.randomUUID(),clientId:c,groupName:cur.groupName,programName:cur.programName,day:cur.day,date:cur.date,durationSec:du,exercises:cur.exercises.map(e=>({name:e.name,sets:e.clients[c].sets}))}));cur=null;A();S();go('history')}
