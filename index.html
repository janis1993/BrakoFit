<!doctype html><html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b10"><link rel="manifest" href="manifest.json"><title>BrakoFit V3</title><style>
:root{--bg:#080b10;--panel:#111720;--panel2:#171f2b;--line:#283241;--text:#f3f6f8;--muted:#94a0af;--accent:#79e08f;--accent2:#1f5733;--red:#ff7474}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:5;background:#0b1017eF;backdrop-filter:blur(12px);padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}header b{font-size:21px;color:var(--accent)}small,.muted{color:var(--muted)}main{max-width:1000px;margin:auto;padding:18px 14px 90px}.card{background:linear-gradient(150deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.hero{background:linear-gradient(135deg,#153a25,#111a22)}h1,h2,h3{margin:.2em 0 .6em}.grid{display:grid;gap:12px}.two{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}button{border:0;border-radius:11px;padding:10px 13px;background:var(--accent);color:#07120b;font-weight:800;cursor:pointer}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.danger{background:#3c1c22;color:#ff9da5}.tag{display:inline-block;background:var(--accent2);color:#a9f2b7;padding:4px 8px;border-radius:20px;font-size:12px;font-weight:700;margin:2px}input,select,textarea{width:100%;background:#0b1118;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}label{display:block;color:#cdd5de;font-size:13px;font-weight:700;margin:9px 0 4px}.exercise{padding:10px 0;border-top:1px solid var(--line)}.sets{display:grid;grid-template-columns:32px 1fr 1fr 38px;gap:7px;margin:7px 0;align-items:center}nav{position:fixed;z-index:9;bottom:0;left:0;right:0;background:#0c1118;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px}nav button{background:none;color:var(--muted);font-size:12px;padding:6px 1px}nav button.active{color:var(--accent)}dialog{width:min(520px,94%);border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);padding:18px}dialog::backdrop{background:#000b}.empty{text-align:center;color:var(--muted);padding:30px}@media(min-width:760px){nav{top:61px;bottom:0;right:auto;width:150px;display:flex;flex-direction:column;padding:16px 8px}nav button{font-size:14px;text-align:left;padding:12px}main{padding-left:170px}.sets{grid-template-columns:36px 1fr 1fr 42px}}</style></head><body><header><b>BrakoFit V3</b><small>Dark mode</small></header><nav id="nav"></nav><main id="app"></main><dialog id="dlg"></dialog><script>
const seed={version:3,programs:[{id:'ppl-linda',name:'Linda PPL',days:[{name:'Push',ex:['Incline chest press','Bench chest press','Chest fly','Shoulder press','Lateral raises','Triceps rope']},{name:'Pull',ex:['Lat pulldown','Rows cable','Low row','Barbell row','Biceps curl','Hammer curl']},{name:'Legs',ex:['Belt squat uz sēžu','Hip thrust','Squat','Leg extension','Leg curl']}]}],clients:[{id:'linda',name:'Linda',programId:'ppl-linda',notes:''}],events:[],sessions:[],groups:[]};
let db;try{db=JSON.parse(localStorage.getItem('brakofit-v3'))||seed}catch(e){db=seed}if(!db.groups)db.groups=[];const save=()=>localStorage.setItem('brakofit-v3',JSON.stringify(db));save();let page='home',current=null,clientId=null;const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tabs=[['home','⌂ Sākums'],['clients','♙ Klienti'],['programs','▤ Programmas'],['groups','◎ Grupas'],['calendar','▣ Kalendārs'],['history','↻ Vēsture']];function go(p){page=p;render()}function render(){nav.innerHTML=tabs.map(t=>`<button class="${page===t[0]?'active':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');({home,clients,programs,groups,calendar,history,workout,groupWorkout,client}[page]||home)()}
function program(id){return db.programs.find(p=>p.id===id)}function home(){app.innerHTML=`<div class="card hero"><small>Trenera darba vide</small><h1>Ātri sāc treniņu</h1><p class="muted">Izvēlies klientu un viņa programmas dienu.</p></div><div class="grid two">${db.clients.map(c=>{let p=program(c.programId);return `<div class="card"><h3>${E(c.name)}</h3><p>${p?`<span class=tag>${E(p.name)}</span>`:'<span class=muted>Programma nav piešķirta</span>'}</p>${p?`<select id="d-${c.id}">${p.days.map(d=>`<option>${E(d.name)}</option>`).join('')}</select><button style="width:100%;margin-top:9px" onclick="start('${c.id}',document.getElementById('d-${c.id}').value)">Sākt treniņu</button>`:''}</div>`}).join('')}</div>`}
function clients(){app.innerHTML=`<div class=row><h1>Klienti</h1><button onclick="clientForm()">+ Klients</button></div><div class="grid two">${db.clients.map(c=>`<div class=card><h3>${E(c.name)}</h3><p class=muted>${E(program(c.programId)?.name||'Nav programmas')}</p><div class=row><button class=secondary onclick="openClient('${c.id}')">Atvērt</button><button class=secondary onclick="assignForm('${c.id}')">Piešķirt programmu</button></div></div>`).join('')}</div>`}
function openClient(id){clientId=id;page='client';render()}function client(){let c=db.clients.find(x=>x.id===clientId),p=program(c.programId);app.innerHTML=`<button class=secondary onclick="go('clients')">← Atpakaļ</button><div class=card><h1>${E(c.name)}</h1><p>${p?`<span class=tag>${E(p.name)}</span>`:'Nav programmas'}</p><p class=muted>${E(c.notes)}</p>${p?p.days.map(d=>`<button style="margin:4px" onclick="start('${c.id}','${E(d.name)}')">${E(d.name)}</button>`).join(''):''}</div>`}
function clientForm(){dlgOpen(`<h2>Jauns klients</h2><label>Vārds</label><input id=cn><label>Piezīmes</label><textarea id=cnotes></textarea><label>Programma</label><select id=cp><option value="">Bez programmas</option>${db.programs.map(p=>`<option value="${p.id}">${E(p.name)}</option>`).join('')}</select><button onclick="addClient()">Saglabāt</button>`)}function addClient(){if(!cn.value.trim())return;db.clients.push({id:crypto.randomUUID(),name:cn.value.trim(),notes:cnotes.value,programId:cp.value});save();dlgClose();render()}function assignForm(id){dlgOpen(`<h2>Piešķirt programmu</h2><select id=ap><option value="">Bez programmas</option>${db.programs.map(p=>`<option value="${p.id}">${E(p.name)}</option>`).join('')}</select><button onclick="assign('${id}')">Saglabāt</button>`)}function assign(id){db.clients.find(c=>c.id===id).programId=ap.value;save();dlgClose();render()}
function programs(){app.innerHTML=`<div class=row><h1>Programmas</h1><button onclick="programForm()">+ Programma</button></div>${db.programs.map(p=>`<div class=card><div class=row><div><h3>${E(p.name)}</h3><small>${p.days.length} treniņu dienas</small></div><button class=secondary onclick="editProgram('${p.id}')">Rediģēt</button><button class=secondary onclick="copyProgram('${p.id}')">Kopēt</button></div>${p.days.map(d=>`<div class=exercise><b>${E(d.name)}</b><div class=muted>${d.ex.map(E).join(' • ')}</div></div>`).join('')}</div>`).join('')||'<div class=empty>Nav programmu</div>'}`}
function programForm(){dlgOpen(`<h2>Jauna programma</h2><label>Nosaukums</label><input id=pn placeholder="Piem., Full Body iesācējiem"><label>Treniņu dienas</label><textarea id=pd rows=8 placeholder="Push: Bench press, Shoulder press, Triceps\nPull: Lat pulldown, Row, Biceps\nLegs: Squat, Leg press, Leg curl"></textarea><small>Viena diena katrā rindā. Formāts: Diena: vingrinājums, vingrinājums</small><p><button onclick="addProgram()">Izveidot</button></p>`)}function parseDays(t){return t.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{let [n,...r]=x.split(':');return{name:n.trim(),ex:r.join(':').split(',').map(y=>y.trim()).filter(Boolean)}})}function addProgram(){if(!pn.value.trim())return;db.programs.push({id:crypto.randomUUID(),name:pn.value.trim(),days:parseDays(pd.value)});save();dlgClose();render()}function editProgram(id){let p=program(id),txt=p.days.map(d=>d.name+': '+d.ex.join(', ')).join('\n');dlgOpen(`<h2>Rediģēt programmu</h2><label>Nosaukums</label><input id=epn value="${E(p.name)}"><label>Dienas un vingrinājumi</label><textarea id=epd rows=10>${E(txt)}</textarea><button onclick="saveProgram('${id}')">Saglabāt</button> <button class=danger onclick="deleteProgram('${id}')">Dzēst</button>`)}function saveProgram(id){let p=program(id);p.name=epn.value.trim();p.days=parseDays(epd.value);save();dlgClose();render()}function deleteProgram(id){db.programs=db.programs.filter(p=>p.id!==id);db.clients.forEach(c=>{if(c.programId===id)c.programId=''});save();dlgClose();render()}function copyProgram(id){let p=program(id);db.programs.push({id:crypto.randomUUID(),name:p.name+' kopija',days:JSON.parse(JSON.stringify(p.days))});save();render()}
function start(cid,day){let c=db.clients.find(x=>x.id===cid),p=program(c.programId),d=p.days.find(x=>x.name===day);current={id:crypto.randomUUID(),clientId:cid,programId:p.id,programName:p.name,day,date:new Date().toISOString().slice(0,10),exercises:d.ex.map(n=>({name:n,sets:[{kg:'',reps:''},{kg:'',reps:''},{kg:'',reps:''}]}))};page='workout';render()}function previous(cid,n){for(let s of [...db.sessions].reverse()){if(s.clientId===cid){let e=s.exercises.find(x=>x.name===n);if(e)return e}}}function workout(){let c=db.clients.find(x=>x.id===current.clientId);app.innerHTML=`<button class=secondary onclick="go('home')">← Iziet</button><div class="card hero"><small>${E(current.programName)}</small><h1>${E(c.name)} · ${E(current.day)}</h1></div>${current.exercises.map((e,i)=>{let prev=previous(current.clientId,e.name);return `<div class=card><div class=row><h3>${E(e.name)}</h3><button class=secondary onclick="renameEx(${i})">Mainīt</button></div>${prev?`<small>Iepriekš: ${prev.sets.map(s=>E(s.kg)+' kg × '+E(s.reps)).join(', ')}</small>`:''}${e.sets.map((s,j)=>`<div class=sets><b>${j+1}.</b><input placeholder=kg inputmode=decimal value="${E(s.kg)}" onchange="current.exercises[${i}].sets[${j}].kg=this.value"><input placeholder=reizes inputmode=numeric value="${E(s.reps)}" onchange="current.exercises[${i}].sets[${j}].reps=this.value"><button class=danger onclick="delSet(${i},${j})">×</button></div>`).join('')}<button class=secondary onclick="addSet(${i})">+ Sets</button></div>`}).join('')}<button style="width:100%" onclick="finish()">Saglabāt treniņu</button>`}function addSet(i){current.exercises[i].sets.push({kg:'',reps:''});render()}function delSet(i,j){current.exercises[i].sets.splice(j,1);render()}function renameEx(i){let n=prompt('Jaunais vingrinājums',current.exercises[i].name);if(n){current.exercises[i].name=n;render()}}function finish(){db.sessions.push(current);current=null;save();go('history')}
function groups(){app.innerHTML=`<div class=row><h1>Grupu treniņi</h1><button onclick="groupForm()">+ Grupa</button></div><p class=muted>Izveido pāri vai grupu, pievieno klientus un vadi vienu kopīgu treniņu, saglabājot katram dalībniekam atsevišķus svarus.</p>${db.groups.map(g=>{let p=program(g.programId);return `<div class=card><div class=row><div><h3>${E(g.name)}</h3><small>${g.clientIds.map(id=>E(db.clients.find(c=>c.id===id)?.name||'')).filter(Boolean).join(' + ')}</small></div><button class=secondary onclick="editGroup('${g.id}')">Rediģēt</button></div><p>${p?`<span class=tag>${E(p.name)}</span>`:'<span class=muted>Nav programmas</span>'}</p>${p?p.days.map(d=>`<button style="margin:3px" onclick="startGroup('${g.id}','${E(d.name)}')">${E(d.name)}</button>`).join(''):''}</div>`}).join('')||'<div class=empty>Vēl nav izveidotu grupu.</div>'}`}
function groupForm(id){let g=id?db.groups.find(x=>x.id===id):null;dlgOpen(`<h2>${g?'Rediģēt':'Jauna'} grupa</h2><label>Grupas nosaukums</label><input id=gn value="${E(g?.name||'') }" placeholder="Piem., Linda + Laura"><label>Dalībnieki</label><div>${db.clients.map(c=>`<label><input style="width:auto" type=checkbox class=gmember value="${c.id}" ${g?.clientIds.includes(c.id)?'checked':''}> ${E(c.name)}</label>`).join('')}</div><label>Kopīgā programma</label><select id=gp><option value="">Bez programmas</option>${db.programs.map(p=>`<option value="${p.id}" ${g?.programId===p.id?'selected':''}>${E(p.name)}</option>`).join('')}</select><button onclick="saveGroup('${id||''}')">Saglabāt</button>${g?` <button class=danger onclick="deleteGroup('${g.id}')">Dzēst</button>`:''}`)}
function saveGroup(id){let ids=[...document.querySelectorAll('.gmember:checked')].map(x=>x.value);if(!gn.value.trim()||ids.length<2){alert('Norādi grupas nosaukumu un vismaz divus klientus.');return}let g=id?db.groups.find(x=>x.id===id):null;if(g){g.name=gn.value.trim();g.clientIds=ids;g.programId=gp.value}else db.groups.push({id:crypto.randomUUID(),name:gn.value.trim(),clientIds:ids,programId:gp.value});save();dlgClose();render()}
function editGroup(id){groupForm(id)}function deleteGroup(id){db.groups=db.groups.filter(g=>g.id!==id);save();dlgClose();render()}
function startGroup(gid,day){let g=db.groups.find(x=>x.id===gid),p=program(g.programId),d=p?.days.find(x=>x.name===day);if(!d)return;current={id:crypto.randomUUID(),groupId:gid,groupName:g.name,clientIds:g.clientIds,programId:p.id,programName:p.name,day,date:new Date().toISOString().slice(0,10),exercises:d.ex.map(n=>({name:n,clients:Object.fromEntries(g.clientIds.map(cid=>[cid,{sets:[{kg:'',reps:''},{kg:'',reps:''},{kg:'',reps:''}]}]))}))};page='groupWorkout';render()}
function groupPrevious(cid,n){return previous(cid,n)}
function groupWorkout(){let g=db.groups.find(x=>x.id===current.groupId);app.innerHTML=`<button class=secondary onclick="go('groups')">← Iziet</button><div class="card hero"><small>${E(current.programName)}</small><h1>${E(g.name)} · ${E(current.day)}</h1><p class=muted>Katram klientam ievadi svarus atsevišķi. Vingrinājumu secība ir kopīga.</p></div>${current.exercises.map((ex,ei)=>`<div class=card><div class=row><h3>${E(ex.name)}</h3><button class=secondary onclick="renameGroupEx(${ei})">Mainīt</button></div><div class="grid two">${current.clientIds.map(cid=>{let c=db.clients.find(x=>x.id===cid),data=ex.clients[cid],prev=groupPrevious(cid,ex.name);return `<div style="background:#0b1118;border:1px solid var(--line);border-radius:14px;padding:12px"><h3>${E(c?.name)}</h3>${prev?`<small>Iepriekš: ${prev.sets.map(s=>E(s.kg)+' kg × '+E(s.reps)).join(', ')}</small>`:''}${data.sets.map((s,si)=>`<div class=sets><b>${si+1}.</b><input placeholder=kg inputmode=decimal value="${E(s.kg)}" onchange="current.exercises[${ei}].clients['${cid}'].sets[${si}].kg=this.value"><input placeholder=reizes inputmode=numeric value="${E(s.reps)}" onchange="current.exercises[${ei}].clients['${cid}'].sets[${si}].reps=this.value"><button class=danger onclick="delGroupSet(${ei},'${cid}',${si})">×</button></div>`).join('')}<button class=secondary onclick="addGroupSet(${ei},'${cid}')">+ Sets</button></div>`}).join('')}</div></div>`).join('')}<button style="width:100%" onclick="finishGroup()">Saglabāt grupas treniņu</button>`}
function addGroupSet(ei,cid){current.exercises[ei].clients[cid].sets.push({kg:'',reps:''});render()}function delGroupSet(ei,cid,si){current.exercises[ei].clients[cid].sets.splice(si,1);render()}function renameGroupEx(i){let n=prompt('Jaunais vingrinājums',current.exercises[i].name);if(n){current.exercises[i].name=n;render()}}
function finishGroup(){let groupSessionId=current.id;current.clientIds.forEach(cid=>{db.sessions.push({id:crypto.randomUUID(),groupSessionId,groupName:current.groupName,clientId:cid,programId:current.programId,programName:current.programName,day:current.day,date:current.date,exercises:current.exercises.map(ex=>({name:ex.name,sets:ex.clients[cid].sets}))})});current=null;save();go('history')}
function calendar(){app.innerHTML=`<div class=row><h1>Kalendārs</h1><button onclick="eventForm()">+ Klients</button><button onclick="groupEventForm()">+ Grupa</button></div>${db.events.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(e=>{let c=db.clients.find(x=>x.id===e.clientId),g=db.groups.find(x=>x.id===e.groupId);return `<div class=card><b>${E(c?.name||g?.name)}</b> <span class=tag>${E(e.day)}</span><div class=muted>${e.date} ${e.time}</div></div>`}).join('')||'<div class=empty>Nav pierakstu</div>'}`};function eventForm(){dlgOpen(`<h2>Jauns pieraksts</h2><label>Klients</label><select id=ec onchange="fillDays()">${db.clients.map(c=>`<option value=${c.id}>${E(c.name)}</option>`).join('')}</select><label>Treniņš</label><select id=eday></select><div class=row><div><label>Datums</label><input id=ed type=date value=${new Date().toISOString().slice(0,10)}></div><div><label>Laiks</label><input id=et type=time value=10:00></div></div><button onclick="addEvent()">Saglabāt</button>`);fillDays()}function fillDays(){let c=db.clients.find(x=>x.id===ec.value),p=program(c?.programId);eday.innerHTML=(p?.days||[]).map(d=>`<option>${E(d.name)}</option>`).join('')}function addEvent(){db.events.push({id:crypto.randomUUID(),clientId:ec.value,day:eday.value,date:ed.value,time:et.value});save();dlgClose();render()}
function groupEventForm(){dlgOpen(`<h2>Grupas pieraksts</h2><label>Grupa</label><select id=eg onchange="fillGroupDays()">${db.groups.map(g=>`<option value="${g.id}">${E(g.name)}</option>`).join('')}</select><label>Treniņš</label><select id=egday></select><div class=row><div><label>Datums</label><input id=egd type=date value=${new Date().toISOString().slice(0,10)}></div><div><label>Laiks</label><input id=egt type=time value=10:00></div></div><button onclick="addGroupEvent()">Saglabāt visu grupu vienā ierakstā</button>`);fillGroupDays()}function fillGroupDays(){let g=db.groups.find(x=>x.id===eg.value),p=program(g?.programId);egday.innerHTML=(p?.days||[]).map(d=>`<option>${E(d.name)}</option>`).join('')}function addGroupEvent(){db.events.push({id:crypto.randomUUID(),groupId:eg.value,day:egday.value,date:egd.value,time:egt.value});save();dlgClose();render()}
function history(){app.innerHTML=`<div class=row><h1>Vēsture</h1><button onclick="exportData()">Eksportēt</button></div>${[...db.sessions].reverse().map(s=>`<div class=card><b>${E(db.clients.find(c=>c.id===s.clientId)?.name)}</b> <span class=tag>${E(s.day)}</span><div class=muted>${s.date} · ${E(s.programName)} ${s.groupName?'· Grupa: '+E(s.groupName):''}</div></div>`).join('')||'<div class=empty>Nav treniņu</div>'}<div class=card><label>Importēt V2 rezerves kopiju</label><input type=file accept=.json onchange="importData(this.files[0])"></div>`}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='brakofit-v2-backup.json';a.click()}function importData(f){let r=new FileReader;r.onload=()=>{try{db=JSON.parse(r.result);save();render()}catch(e){alert('Nederīgs fails')}};r.readAsText(f)}
function dlgOpen(x){dlg.innerHTML=x+'<p><button class=secondary onclick="dlgClose()">Aizvērt</button></p>';dlg.showModal()}function dlgClose(){dlg.close()}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();
</script></body></html>
